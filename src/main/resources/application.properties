# =============================================
# Database Configuration — UPDATE THESE VALUES
# =============================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/word_scramble_db?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed data — runs once on startup (safe: only inserts if table is empty)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# App runs on port 8080
server.port=8080
