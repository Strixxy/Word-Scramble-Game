<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Scramble</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f0e17;
    --surface:  #1a1928;
    --card:     #22213a;
    --accent:   #ff6b35;
    --yellow:   #ffd166;
    --green:    #06d6a0;
    --blue:     #118ab2;
    --pink:     #ef476f;
    --text:     #fffffe;
    --muted:    #a7a9be;
    --radius:   18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background bubbles ── */
  body::before {
    content: '';
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%);
    top: -100px; right: -100px;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6,214,160,0.07) 0%, transparent 70%);
    bottom: -100px; left: -100px;
    pointer-events: none;
  }

  /* ── Screens ── */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

  /* ── HOME SCREEN ── */
  .logo {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(3rem, 10vw, 5.5rem);
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .logo span { color: var(--accent); }

  .tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 40px;
    text-align: center;
  }

  .home-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 36px;
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.08);
    background: var(--surface);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 20px;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface); }

  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 6px 24px rgba(255,107,53,0.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(255,107,53,0.5); }

  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    margin-top: 10px;
  }

  .btn-green {
    background: var(--green);
    color: #0f0e17;
    box-shadow: 0 6px 24px rgba(6,214,160,0.3);
  }

  .btn-pink {
    background: var(--pink);
    color: white;
    box-shadow: 0 6px 24px rgba(239,71,111,0.3);
  }

  /* ── GAME SCREEN ── */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 600px;
    margin-bottom: 24px;
  }

  .stat-pill {
    background: var(--card);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.9rem;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .stat-pill span { color: var(--accent); }

  /* Timer ring */
  .timer-wrap {
    position: relative;
    width: 70px; height: 70px;
  }
  .timer-svg { transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5; }
  .timer-bar {
    fill: none;
    stroke: var(--green);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 188;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.5s;
  }
  .timer-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Boogaloo', cursive;
    font-size: 1.4rem;
    color: var(--text);
  }

  /* Scrambled word */
  .scramble-box {
    background: var(--card);
    border-radius: var(--radius);
    padding: 32px 40px;
    width: 100%;
    max-width: 600px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }

  .category-tag {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 50px;
    background: rgba(255,107,53,0.15);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .scrambled-word {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    letter-spacing: 8px;
    color: var(--yellow);
    text-shadow: 0 0 30px rgba(255,209,102,0.3);
    margin-bottom: 12px;
    word-break: break-all;
  }

  .word-length {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
  }

  /* Answer input area */
  .answer-area {
    width: 100%;
    max-width: 600px;
    margin-bottom: 16px;
  }

  .answer-row {
    display: flex;
    gap: 10px;
  }

  .answer-row input {
    flex: 1;
    margin-bottom: 0;
    font-size: 1.2rem;
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .answer-row .btn {
    width: auto;
    padding: 14px 28px;
    flex-shrink: 0;
  }

  /* Feedback */
  .feedback {
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 28px;
    margin-bottom: 12px;
    transition: all 0.3s;
    text-align: center;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong   { color: var(--pink); }
  .feedback.hint    { color: var(--yellow); }

  /* Hint & Skip row */
  .action-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }
  .action-row .btn {
    font-size: 0.9rem;
    padding: 12px;
  }

  /* Hints display */
  .hints-area {
    width: 100%;
    max-width: 600px;
    margin-bottom: 16px;
    min-height: 60px;
  }
  .hint-badge {
    display: inline-block;
    background: rgba(255,209,102,0.1);
    border: 1px solid rgba(255,209,102,0.2);
    color: var(--yellow);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 8px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.06);
    border-radius: 50px;
    height: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--yellow));
    border-radius: 50px;
    transition: width 0.5s ease;
  }
  .progress-text {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: right;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }

  /* ── RESULTS SCREEN ── */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .trophy { font-size: 4rem; margin-bottom: 12px; display: block; }

  .result-title {
    font-family: 'Boogaloo', cursive;
    font-size: 2.2rem;
    margin-bottom: 6px;
  }

  .result-score {
    font-family: 'Boogaloo', cursive;
    font-size: 4rem;
    color: var(--yellow);
    line-height: 1;
    margin: 20px 0 6px;
    text-shadow: 0 0 30px rgba(255,209,102,0.3);
  }

  .result-sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-box {
    flex: 1;
    background: var(--surface);
    border-radius: 12px;
    padding: 16px 12px;
  }
  .stat-box .num {
    font-family: 'Boogaloo', cursive;
    font-size: 2rem;
    color: var(--green);
  }
  .stat-box .lbl {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
    margin-top: 2px;
  }

  /* ── LEADERBOARD SCREEN ── */
  .lb-title {
    font-family: 'Boogaloo', cursive;
    font-size: 2.5rem;
    margin-bottom: 24px;
    text-align: center;
  }

  .lb-table {
    width: 100%;
    max-width: 500px;
    border-collapse: collapse;
  }

  .lb-table th {
    text-align: left;
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .lb-table td {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-weight: 700;
  }

  .lb-table tr:first-child td { color: var(--yellow); font-size: 1.1rem; }
  .lb-table tr:nth-child(2) td { color: var(--muted); }
  .lb-table tr:nth-child(3) td { color: #cd7f32; }

  .rank-num {
    font-family: 'Boogaloo', cursive;
    font-size: 1.3rem;
    color: var(--muted);
  }

  .score-val { color: var(--accent) !important; }

  .empty-lb {
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 1rem;
  }

  /* ── Shake animation on wrong ── */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* ── Pop animation on correct ── */
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .action-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<!-- ═══════════════ HOME SCREEN ═══════════════ -->
<div class="screen active" id="homeScreen">
  <div class="logo">Word<span>Scramble</span></div>
  <p class="tagline">Unscramble letters, race the clock, top the board 🔥</p>

  <div class="home-card">
    <label for="playerName">Your Name</label>
    <input type="text" id="playerName" placeholder="e.g. Arjun" maxlength="20">

    <label for="categorySelect">Category</label>
    <select id="categorySelect">
      <option value="">🎲 Random (All Categories)</option>
    </select>

    <button class="btn btn-primary" onclick="startGame()">Play Now →</button>
    <button class="btn btn-secondary" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </div>
</div>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div class="screen" id="gameScreen">

  <div class="game-header">
    <div class="stat-pill">Score: <span id="scoreDisplay">0</span></div>
    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 70 70" width="70" height="70">
        <circle class="timer-track" cx="35" cy="35" r="30"/>
        <circle class="timer-bar" id="timerBar" cx="35" cy="35" r="30"/>
      </svg>
      <div class="timer-text" id="timerText">30</div>
    </div>
    <div class="stat-pill">Hints: <span id="hintsLeft">2</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText">Word 1 of 5</div>

  <div class="scramble-box" id="scrambleBox">
    <div class="category-tag" id="categoryTag">—</div>
    <div class="scrambled-word" id="scrambledWord">LOADING</div>
    <div class="word-length" id="wordLength">_ _ _ _ _</div>
  </div>

  <div class="hints-area" id="hintsArea"></div>

  <div class="feedback" id="feedback"></div>

  <div class="answer-area">
    <div class="answer-row">
      <input type="text" id="answerInput" placeholder="Type your answer..." 
             onkeydown="if(event.key==='Enter') submitAnswer()">
      <button class="btn btn-primary" onclick="submitAnswer()">Go!</button>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="useHint()">💡 Hint (-50 pts)</button>
    <button class="btn btn-secondary" onclick="giveUp()">🏳️ Give Up</button>
    <button class="btn btn-secondary" onclick="skipWord()">⏭️ Skip</button>
  </div>

</div>

<!-- ═══════════════ RESULTS SCREEN ═══════════════ -->
<div class="screen" id="resultsScreen">
  <div class="results-card">
    <span class="trophy" id="trophyEmoji">🎉</span>
    <div class="result-title" id="resultTitle">Well Done!</div>
    <div style="color:var(--muted); font-size:0.9rem;">Your Score</div>
    <div class="result-score" id="finalScore">0</div>
    <div class="result-sub" id="finalSub">You got 0 out of 5 correct</div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="num" id="statCorrect">0</div>
        <div class="lbl">Correct</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statTime" style="color:var(--blue)">0s</div>
        <div class="lbl">Avg Time</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statAccuracy" style="color:var(--yellow)">0%</div>
        <div class="lbl">Accuracy</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="startGame()" style="margin-bottom:10px">Play Again 🔄</button>
    <button class="btn btn-secondary" onclick="showLeaderboard()">🏆 View Leaderboard</button>
    <button class="btn btn-secondary" onclick="showScreen('homeScreen')" style="margin-top:10px">🏠 Home</button>
  </div>
</div>

<!-- ═══════════════ LEADERBOARD SCREEN ═══════════════ -->
<div class="screen" id="leaderboardScreen">
  <div class="lb-title">🏆 Leaderboard</div>
  <table class="lb-table" id="lbTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Score</th>
        <th>Correct</th>
      </tr>
    </thead>
    <tbody id="lbBody"></tbody>
  </table>
  <br>
  <button class="btn btn-secondary" style="max-width:300px" onclick="showScreen('homeScreen')">← Back to Home</button>
</div>

<script>
  // ── Config ──────────────────────────────────────
  const API = 'http://localhost:8080/api/game';
  const TOTAL_WORDS   = 5;
  const TIME_PER_WORD = 30;  // seconds
  const BASE_POINTS   = 200;
  const HINT_PENALTY  = 50;

  // ── State ────────────────────────────────────────
  let playerName  = '';
  let category    = '';
  let currentWord = null;   // { wordId, scrambled, category, hint1, hint2, length }
  let score       = 0;
  let wordIndex   = 0;
  let hintsUsed   = 0;
  let timerSecs   = TIME_PER_WORD;
  let timerInterval = null;
  let timeTakenThisWord = 0;
  let totalTimeTaken = 0;
  let wordsCorrect   = 0;

  // ── Screen helper ────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── Load categories on page load ─────────────────
  window.addEventListener('load', async () => {
    try {
      const res = await fetch(`${API}/categories`);
      const cats = await res.json();
      const sel = document.getElementById('categorySelect');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    } catch(e) {
      console.warn('Could not load categories — is the backend running?', e);
    }
  });

  // ── Start Game ───────────────────────────────────
  async function startGame() {
    playerName = document.getElementById('playerName').value.trim() || 'Player';
    category   = document.getElementById('categorySelect')?.value || '';
    score       = 0;
    wordIndex   = 0;
    wordsCorrect = 0;
    totalTimeTaken = 0;

    showScreen('gameScreen');
    await loadNextWord();
  }

  // ── Load a word from backend ──────────────────────
  async function loadNextWord() {
    if (wordIndex >= TOTAL_WORDS) {
      endGame();
      return;
    }

    clearFeedback();
    document.getElementById('hintsArea').innerHTML = '';
    document.getElementById('answerInput').value = '';
    document.getElementById('answerInput').disabled = false;
    hintsUsed = 0;
    document.getElementById('hintsLeft').textContent = '2';

    // Progress
    const pct = (wordIndex / TOTAL_WORDS) * 100;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = `Word ${wordIndex + 1} of ${TOTAL_WORDS}`;

    try {
      const url = category ? `${API}/word?category=${encodeURIComponent(category)}` : `${API}/word`;
      const res  = await fetch(url);
      currentWord = await res.json();

      document.getElementById('categoryTag').textContent   = currentWord.category;
      document.getElementById('scrambledWord').textContent = currentWord.scrambled;
      document.getElementById('wordLength').textContent    = '_ '.repeat(currentWord.length).trim();
      document.getElementById('scoreDisplay').textContent  = score;

      // Animate box
      const box = document.getElementById('scrambleBox');
      box.classList.remove('pop');
      void box.offsetWidth;
      box.classList.add('pop');

    } catch(e) {
      setFeedback('⚠️ Could not reach backend. Is Spring Boot running?', 'wrong');
    }

    startTimer();
  }

  // ── Timer ─────────────────────────────────────────
  function startTimer() {
    clearInterval(timerInterval);
    timerSecs = TIME_PER_WORD;
    timeTakenThisWord = 0;
    updateTimerUI();

    timerInterval = setInterval(() => {
      timerSecs--;
      timeTakenThisWord++;
      updateTimerUI();
      if (timerSecs <= 0) {
        clearInterval(timerInterval);
        timeUp();
      }
    }, 1000);
  }

  function updateTimerUI() {
    const circumference = 2 * Math.PI * 30; // r=30
    const offset = circumference * (1 - timerSecs / TIME_PER_WORD);
    const bar = document.getElementById('timerBar');
    bar.style.strokeDashoffset = offset;
    // Color: green → yellow → red
    if (timerSecs > 15)      bar.style.stroke = '#06d6a0';
    else if (timerSecs > 8)  bar.style.stroke = '#ffd166';
    else                     bar.style.stroke = '#ef476f';
    document.getElementById('timerText').textContent = timerSecs;
  }

  function timeUp() {
    setFeedback('⏰ Time\'s up!', 'wrong');
    document.getElementById('answerInput').disabled = true;
    totalTimeTaken += TIME_PER_WORD;
    wordIndex++;
    setTimeout(loadNextWord, 1800);
  }

  // ── Submit answer ─────────────────────────────────
  async function submitAnswer() {
    const guess = document.getElementById('answerInput').value.trim();
    if (!guess || !currentWord) return;

    try {
      const res  = await fetch(`${API}/check`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wordId: currentWord.wordId, guess })
      });
      const data = await res.json();

      clearInterval(timerInterval);
      totalTimeTaken += (TIME_PER_WORD - timerSecs);
      wordIndex++;

      if (data.correct) {
        wordsCorrect++;
        // Points = base - penalty per hint - time penalty
        const hintPenalty = hintsUsed * HINT_PENALTY;
        const timePenalty = Math.floor((TIME_PER_WORD - timerSecs) * 3);
        const points = Math.max(10, BASE_POINTS - hintPenalty - timePenalty);
        score += points;

        document.getElementById('scoreDisplay').textContent = score;
        setFeedback(`✅ Correct! +${points} pts`, 'correct');
        document.getElementById('scrambleBox').classList.remove('pop');
        void document.getElementById('scrambleBox').offsetWidth;
        document.getElementById('scrambleBox').classList.add('pop');
        setTimeout(loadNextWord, 1500);
      } else {
        setFeedback('❌ Wrong! Try again.', 'wrong');
        document.getElementById('answerInput').classList.remove('shake');
        void document.getElementById('answerInput').offsetWidth;
        document.getElementById('answerInput').classList.add('shake');
        document.getElementById('answerInput').value = '';
        wordIndex--; // don't count as attempted
        startTimer();
        wordIndex++;
      }
    } catch(e) {
      setFeedback('⚠️ Network error. Check backend.', 'wrong');
    }
  }

  // ── Hints ─────────────────────────────────────────
  function useHint() {
    if (!currentWord) return;
    if (hintsUsed >= 2) {
      setFeedback('No more hints!', 'wrong');
      return;
    }

    hintsUsed++;
    document.getElementById('hintsLeft').textContent = 2 - hintsUsed;

    const hintText = hintsUsed === 1 ? currentWord.hint1 : currentWord.hint2;
    const badge = document.createElement('div');
    badge.className = 'hint-badge';
    badge.textContent = `💡 Hint ${hintsUsed}: ${hintText}`;
    document.getElementById('hintsArea').appendChild(badge);
    setFeedback(`Hint revealed! (-${HINT_PENALTY} pts if correct)`, 'hint');
  }

  // ── Give Up ───────────────────────────────────────
  async function giveUp() {
    if (!currentWord) return;
    clearInterval(timerInterval);
    try {
      const res  = await fetch(`${API}/reveal`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wordId: currentWord.wordId })
      });
      const data = await res.json();
      setFeedback(`😢 The word was: ${data.actualWord.toUpperCase()}`, 'wrong');
    } catch(e) {
      setFeedback('The word was: [offline mode]', 'wrong');
    }
    totalTimeTaken += (TIME_PER_WORD - timerSecs);
    wordIndex++;
    document.getElementById('answerInput').disabled = true;
    setTimeout(loadNextWord, 2000);
  }

  // ── Skip ──────────────────────────────────────────
  function skipWord() {
    clearInterval(timerInterval);
    totalTimeTaken += (TIME_PER_WORD - timerSecs);
    wordIndex++;
    loadNextWord();
  }

  // ── End Game ──────────────────────────────────────
  async function endGame() {
    clearInterval(timerInterval);
    showScreen('resultsScreen');

    const accuracy = Math.round((wordsCorrect / TOTAL_WORDS) * 100);
    const avgTime  = TOTAL_WORDS > 0 ? Math.round(totalTimeTaken / TOTAL_WORDS) : 0;

    document.getElementById('finalScore').textContent   = score;
    document.getElementById('statCorrect').textContent  = `${wordsCorrect}/${TOTAL_WORDS}`;
    document.getElementById('statTime').textContent     = `${avgTime}s`;
    document.getElementById('statAccuracy').textContent = `${accuracy}%`;
    document.getElementById('finalSub').textContent     = `You got ${wordsCorrect} out of ${TOTAL_WORDS} correct`;

    // Trophy + title based on score
    const trophy = document.getElementById('trophyEmoji');
    const title  = document.getElementById('resultTitle');
    if (accuracy === 100) { trophy.textContent = '🏆'; title.textContent = 'Perfect Game!'; }
    else if (accuracy >= 60) { trophy.textContent = '🎉'; title.textContent = 'Great Job!'; }
    else if (accuracy >= 40) { trophy.textContent = '👍'; title.textContent = 'Not Bad!'; }
    else { trophy.textContent = '💪'; title.textContent = 'Keep Practicing!'; }

    // Save score to backend
    try {
      await fetch(`${API}/score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          playerName,
          score,
          wordsCorrect,
          totalWords: TOTAL_WORDS
        })
      });
    } catch(e) {
      console.warn('Could not save score to backend.');
    }
  }

  // ── Leaderboard ───────────────────────────────────
  async function showLeaderboard() {
    showScreen('leaderboardScreen');
    const tbody = document.getElementById('lbBody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty-lb">Loading...</td></tr>';

    try {
      const res    = await fetch(`${API}/scores`);
      const scores = await res.json();

      if (scores.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-lb">No scores yet. Be the first!</td></tr>';
        return;
      }

      const medals = ['🥇','🥈','🥉'];
      tbody.innerHTML = scores.map((s, i) => `
        <tr>
          <td class="rank-num">${medals[i] || (i+1)}</td>
          <td>${s.playerName}</td>
          <td class="score-val">${s.score}</td>
          <td>${s.wordsCorrect}/${s.totalWords}</td>
        </tr>
      `).join('');
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-lb">⚠️ Could not load leaderboard. Is the backend running?</td></tr>';
    }
  }

  // ── Helpers ───────────────────────────────────────
  function setFeedback(msg, type) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = `feedback ${type}`;
  }
  function clearFeedback() {
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
  }
</script>
</body>
</html>
